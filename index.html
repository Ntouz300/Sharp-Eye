<!doctype html>
<html lang="fr" data-theme="tournoi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sharp Eye</title>
    <meta name="description" content="Revue de parties d'échecs sur iPad : précision, étiquettes de coups et moments clés, calculés sur ton appareil." />
    <meta name="theme-color" content="#F6F0E2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sharp Eye" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('sharp-eye:settings') || '{}');
        if (s.theme) document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
